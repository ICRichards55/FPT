<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>FPT Team Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090B;--surface:#0F1215;--surface2:#171B20;--surface3:#1E242B;
  --border:#252B33;--accent:#FFFFFF;--red:#FF5C35;--green:#2ECC71;
  --fly:#FF5C35;--broad:#3B9EFF;--vert:#2ECC71;--pacer:#F5A623;
  --text:#F0F2F5;--muted:#7A8694;--muted2:#4A5260;
  --team:#e8c84a;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
#login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:16px}
.login-logo{height:60px;mix-blend-mode:screen;margin-bottom:4px}
.login-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.login-sublabel{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--team);margin-top:-8px}
.login-input{width:100%;background:var(--surface3);border:1.5px solid var(--border);border-radius:8px;padding:13px 14px;color:var(--text);font-family:'Barlow',sans-serif;font-size:16px;outline:none;text-align:center;letter-spacing:4px}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--team),#c9a832);color:#111;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.login-error{color:var(--red);font-size:12px;display:none}
.login-hint{font-size:11px;color:var(--muted2)}
#main-app{display:none}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-img{height:36px;mix-blend-mode:screen}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--team)}
.team-badge{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--team);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.team-badge.none{color:var(--muted2)}
.tab-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:12px 12px 10px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#app{padding:16px;max-width:640px;margin:0 auto;padding-bottom:80px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.form-input{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;outline:none;width:100%;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.toggle-group{display:flex;flex-wrap:wrap;gap:6px}
.tog{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:7px 14px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;white-space:nowrap}
.tog.on{background:var(--accent);border-color:var(--accent);color:#000}
.tog.team-on{background:var(--team);border-color:var(--team);color:#111}
.submit-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s}
.btn-accent{background:var(--accent);color:#000}
.btn-team{background:var(--team);color:#111}
.btn-ghost{background:var(--surface3);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}
.result-field{background:var(--surface3);border:1.5px solid var(--border);border-radius:8px;padding:16px 14px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;outline:none;text-align:center;width:100%;-moz-appearance:textfield}
.result-field:focus{border-color:var(--accent)}
.result-field::-webkit-outer-spin-button,.result-field::-webkit-inner-spin-button{-webkit-appearance:none}
.ath-search-wrap{position:relative}
.ath-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;z-index:200;max-height:200px;overflow-y:auto;margin-top:2px}
.ath-dd-item{padding:10px 14px;font-size:14px;cursor:pointer;transition:background .1s}
.ath-dd-item:hover{background:var(--surface3)}
.ath-selected{background:var(--surface3);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.ath-name-disp{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.ath-clear{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px}
.today-row{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.today-row-main{display:flex;justify-content:space-between;align-items:center;gap:10px}
.today-row-edit{background:var(--surface3);border-radius:7px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:10px}
.action-btn{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.roster-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.roster-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.5px}
.roster-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pr-pill{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;margin:2px 2px 2px 0}
.pill-fly{background:rgba(255,92,53,.15);color:var(--fly)}
.pill-broad{background:rgba(59,158,255,.15);color:var(--broad)}
.pill-vert{background:rgba(46,204,113,.15);color:var(--vert)}
.sn-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sn-btn{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:7px 14px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.sn-btn.on{background:var(--team);border-color:var(--team);color:#111}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
.row{display:flex;gap:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:9998;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.team-selector-wrap{background:var(--surface2);border:1px solid var(--team);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.team-selector-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--team);margin-bottom:8px}
.team-chips{display:flex;flex-wrap:wrap;gap:6px}
.team-chip{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:7px 14px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.team-chip.active{background:var(--team);border-color:var(--team);color:#111}
.pr-indicator{min-height:32px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;text-align:center}
.section-divider{height:1px;background:var(--border);margin:16px 0}
.copy-btn{background:rgba(232,200,74,.1);border:1px solid var(--team);border-radius:6px;padding:5px 10px;color:var(--team);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.report-section{margin-bottom:20px}
.report-section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-label{font-size:13px;color:var(--muted)}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800}
canvas{max-width:100%;border-radius:8px;margin-top:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <img class="login-logo" src="/fpt_logo.webp" alt="FPT"/>
    <div class="login-label">Frye Performance Training</div>
    <div class="login-sublabel">Team Portal</div>
    <input class="login-input" id="pass-input" type="password" placeholder="••••••••••" autocomplete="off"/>
    <div class="login-error" id="login-error">Incorrect password</div>
    <button class="login-btn" id="login-btn">Enter</button>
    <div class="login-hint">Access persists for the rest of today</div>
  </div>
</div>

<div id="main-app">
  <div class="header">
    <a class="logo-wrap" href="index.html" style="text-decoration:none;color:inherit;cursor:pointer">
      <img class="logo-img" src="/fpt_logo.webp" alt="FPT"/>
      <div class="header-title">FPT Teams</div>
    </a>
    <div class="team-badge none" id="header-team-badge">No Team Selected</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-log" data-tab="log">Log</button>
    <button class="tab" id="tab-today" data-tab="today">Today</button>
    <button class="tab" id="tab-roster" data-tab="roster">Roster</button>
    <button class="tab" id="tab-ach" data-tab="ach">Achievements</button>
    <button class="tab" id="tab-studio" data-tab="studio">Studio</button>
    <button class="tab" id="tab-att" data-tab="att">Attendance</button>
    <button class="tab" id="tab-settings" data-tab="settings">Settings</button>
  </div>
  <div id="app"></div>
</div>

<div id="toast"></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwirWQw0-hVSwIwVl6RCWcclgRNKia7awlfUzImilUiKjNKtSapuCueOaTwWgTlJ6Uk/exec';

// ── STATE ─────────────────────────────────────────────────────────────────
var state = { teams:[], athletes:{}, profiles:{}, entries:[], achievements:[], branding:{}, sessions:{}, attendance:[], teamMeta:{}, required:{} };

// ── Org / sport / season identity model (Aug 2026) ──────────────────────────
// A "team" entry is one SEASON of an organization's sport program. teamMeta[key] =
// {org, sport, season, year, archived}. The key stays the storage identifier
// (entries/attendance/etc. hang off it unchanged); org and sport are explicit
// fields — multi-word sports like "Track & Field" are first-class, and the org is
// ready to become an access-control scope (athletic director sees all of their
// school's teams). Legacy teams are backfilled by splitting the name on load.
function _meta(key){
  var m=(state.teamMeta&&state.teamMeta[key]);
  if(m&&m.org!=null) return Object.assign({grade:'', archived:false, season:'', year:''}, m);
  if(m&&m.name){ // transitional shape from an earlier draft — split it
    var parts=m.name.trim().split(/\s+/);
    return {org:parts.slice(0,-1).join(' ')||m.name, grade:'', sport:parts.length>1?parts[parts.length-1]:'', season:m.season||'', year:m.year||'', archived:!!m.archived};
  }
  var parts=String(key).trim().split(/\s+/);
  return {org:parts.slice(0,-1).join(' ')||key, grade:'', sport:parts.length>1?parts[parts.length-1]:'', season:'', year:'', archived:false};
}
// Space-joined "Org Sport" -- the ORIGINAL format, kept byte-identical for any team
// with no grade (true sports orgs never see a difference). Grade support (Aug 2026)
// is purely additive: optional, for org types with an intermediate level between
// organization and team (e.g. a school's grade levels) that real sports orgs don't need.
function _orgSport(m){ return (m.org+' '+m.sport).trim(); }
// Dot-separated "Org · Grade · Sport" when a grade is set; falls back to the plain
// space-joined format otherwise -- this is what every display call site should use.
function _orgGradeSport(m){
  if(m.grade) return [m.org,m.grade,m.sport].filter(Boolean).join(' \u00b7 ');
  return _orgSport(m);
}
function _teamDisplay(key){
  var m=_meta(key);
  return _orgGradeSport(m)+(m.season||m.year?(' \u00b7 '+(m.season?m.season+' ':'')+(m.year||'')):'');
}
function _allOrgs(){
  var o={}; (state.teams||[]).forEach(function(t){ var m=_meta(t); if(m.org) o[m.org]=1; });
  return Object.keys(o).sort();
}
function _allGrades(org){
  var g={}; (state.teams||[]).forEach(function(t){ var m=_meta(t); if(m.grade&&(!org||m.org===org)) g[m.grade]=1; });
  return Object.keys(g).sort();
}
function _activeTeams(){ return (state.teams||[]).filter(function(t){ return !_meta(t).archived; }); }
function _archivedTeams(){ return (state.teams||[]).filter(function(t){ return _meta(t).archived; }); }
function _migrateTeamMeta(){
  state.teamMeta=state.teamMeta||{}; state.required=state.required||{};
  (state.teams||[]).forEach(function(t){
    if(state.teamMeta[t]) return;
    // derive season/year from this team's most recent data, if any
    var dates=[];
    (state.entries||[]).forEach(function(e){ if((state.athletes[t]||[]).indexOf(e.athlete)>-1&&e.date) dates.push(e.date); });
    (state.attendance||[]).forEach(function(a){ if(a.team===t&&a.date) dates.push(a.date); });
    dates.sort();
    var sl=_seasonLabel(dates[dates.length-1]||new Date().toISOString().slice(0,10));
    var parts=t.trim().split(/\s+/);
    state.teamMeta[t]={org:parts.slice(0,-1).join(' ')||t, sport:parts.length>1?parts[parts.length-1]:'', season:sl.season, year:sl.year, archived:false};
    if(state.required[t]==null) state.required[t]=2;
  });
}
var currentTab = 'log';
var currentTeam = '';
var TODAY = (function(){
  var d = new Date();
  var et = new Date(d.toLocaleString('en-US',{timeZone:'America/New_York'}));
  return et.getFullYear()+'-'+String(et.getMonth()+1).padStart(2,'0')+'-'+String(et.getDate()).padStart(2,'0');
})();

// Log tab state
var logAthlete = '', logEx = 'fly', logDate = TODAY, logDdOpen = false;
window._athQ = '';

// Today tab state
var todayEditId = null, todayEditData = {};

// Roster state
var rosterQ = '';

// Achievements state
var achAthlete = '', achAthQ = '', achDdOpen = false, achText = '', achWeeks = 4;
var achEditId = null, achEditText = '', achEditWeeks = 4;

// Settings state
var settingsSection = 'teams';

// Branding editor state
var brandingTeam = '', brandingDraft = { logoUrl:'', palette:null }, brandingPullError = false;

// Team exercises (subset of gym)
var EX_LIST = [
  {id:'fly',   name:'10-10 Fly',   unit:'seconds', lower:true,  color:'var(--fly)'},
  {id:'broad', name:'Broad Jump',  unit:'ft + in', lower:false, color:'var(--broad)'},
  {id:'vert',  name:'Skyhook',     unit:'inches',  lower:false, color:'var(--vert)'},
  {id:'pacer', name:'Pacer Test',  unit:'laps',    lower:false, color:'var(--pacer)'},
];

// ── AUTH ──────────────────────────────────────────────────────────────────
function _checkPwd(v){ return v === 'FryeJump1!'; }
function _isAuthed(){ return localStorage.getItem('fpt_teams_auth_date') === TODAY; }

function tryLogin(){
  var v = (document.getElementById('pass-input').value||'').trim();
  if(_checkPwd(v)){
    localStorage.setItem('fpt_teams_auth_date', TODAY);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadData();
  } else {
    var err = document.getElementById('login-error'); err.style.display = 'block';
    var inp = document.getElementById('pass-input'); inp.style.borderColor = 'var(--red)'; inp.value = '';
    setTimeout(function(){ err.style.display='none'; inp.style.borderColor=''; }, 2500);
  }
}

// ── DELEGATED EVENTS ──────────────────────────────────────────────────────
function _handleDelegatedClick(e, prevent){
  if(!e.target) return;
  var el = e.target, id = el.id;
  if(id==='ach-save-edit-btn'){ if(prevent)e.preventDefault(); saveAchEdit(); }
  else if(id==='team-save-btn'){ if(prevent)e.preventDefault(); saveNewTeam(); }
  else if(id==='roster-import-dismiss'){ if(prevent)e.preventDefault(); dismissRosterImport(); }
  else if(id==='team-athlete-add-btn'){ if(prevent)e.preventDefault(); addAthleteToTeam(); }
  else if(id==='branding-pull-btn'){ if(prevent)e.preventDefault(); _pullPalette(); }
  else if(id==='branding-save-btn'){ if(prevent)e.preventDefault(); _saveBranding(); }
  else if(id==='spot-dl-btn'){ if(prevent)e.preventDefault(); _downloadSpotlight(); }
  else if(id==='report-dl-btn'){ if(prevent)e.preventDefault(); _downloadReport(); }
  else if(id==='parent-one-btn'){ if(prevent)e.preventDefault(); downloadParentPdf(studioAthlete); }
  else if(id==='bulk-all-btn'){ if(prevent)e.preventDefault(); _bulkDownloadCards(false); }
  else if(id==='bulk-pos-btn'){ if(prevent)e.preventDefault(); _bulkDownloadCards(true); }
  else if(id==='parent-zip-btn'){ if(prevent)e.preventDefault(); _bulkParentPdfs(); }
}
document.addEventListener('click', function(e){ _handleDelegatedClick(e,false); });
document.addEventListener('touchend', function(e){ _handleDelegatedClick(e,true); });

// ── INIT ──────────────────────────────────────────────────────────────────
(function(){
  if(_isAuthed()){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadData();
  }
  var lb = document.getElementById('login-btn');
  if(lb){
    lb.addEventListener('click', tryLogin);
    lb.addEventListener('touchend', function(e){ e.preventDefault(); tryLogin(); });
  }
  var pi = document.getElementById('pass-input');
  if(pi){ pi.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); }); }
  document.querySelectorAll('[data-tab]').forEach(function(btn){
    var tab = btn.dataset.tab;
    btn.addEventListener('click', function(){ setTab(tab); });
    btn.addEventListener('touchend', function(e){ e.preventDefault(); setTab(tab); });
  });
})();

// ── DATA LOAD / SAVE ──────────────────────────────────────────────────────
var _loadedOK=false;
function _setLoadWarning(show){var el=document.getElementById('load-warning');if(show){if(!el){el=document.createElement('div');el.id='load-warning';el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:11px 14px;font-family:sans-serif;font-size:14px;font-weight:700;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.45)';el.innerHTML='Could not load data from the server. Do NOT add or edit anything - your changes will not save. <button onclick="loadData()" style="margin-left:10px;background:#fff;color:#b91c1c;border:none;border-radius:5px;padding:5px 14px;font-weight:800;cursor:pointer">Retry</button>';document.body.appendChild(el);}el.style.display='block';}else if(el){el.style.display='none';}}
async function loadData(){
  var gotData=false;
  try {
    var r = await fetch(API_URL + '?type=teams');
    var json = await r.json();
    if(json.ok && json.data){
      state = json.data; gotData=true;
      if(!state.teams) state.teams = [];
      if(!state.athletes) state.athletes = {};
      if(!state.profiles) state.profiles = {};
      if(!state.entries) state.entries = [];
      if(!state.achievements) state.achievements = [];
      if(!state.branding) state.branding = {};
    }
  } catch(e){ console.error('Load failed', e); }
  if(gotData){_loadedOK=true; _migrateTeamMeta();_setLoadWarning(false);}
  else if(!_loadedOK){_setLoadWarning(true);}
  render();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function _esc(s){ return String(s).replace(/'/g,"\\'"); }
function fmtFly(v){ return v!=null ? v.toFixed(2)+'s' : '--'; }
function fmtBroad(v){ if(v==null) return '--'; return Math.floor(v/12)+"' "+Math.round(v%12)+'"'; }
function fmtVert(v){ return v!=null ? v.toFixed(3)+'"' : '--'; }
function fmtPacer(v){ return v!=null ? Math.round(v)+' laps' : '--'; }
function fmtPR(id,v){ return id==='fly'?fmtFly(v):id==='broad'?fmtBroad(v):id==='pacer'?fmtPacer(v):fmtVert(v); }
function fmtDate(d){ if(!d) return ''; var p=d.split('-'); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m[parseInt(p[1])-1]+' '+parseInt(p[2])+', '+p[0]; }
function fmtShortDate(d){ if(!d) return ''; var p=d.split('-'); return p[1].replace(/^0/,'')+'/'+p[2].replace(/^0/,'')+'/'+p[0].slice(2); }
function lastName(name){ return (name||'').split(' ').pop(); }

function getTeamAthletes(){
  if(!currentTeam) return [];
  return (state.athletes[currentTeam]||[]).slice().sort(function(a,b){ return lastName(a).localeCompare(lastName(b)); });
}

function getPR(ath, id){
  var vals = state.entries
    .filter(function(e){ return e.athlete===ath && e.exercise===id; })
    .map(function(e){ return id==='broad'?e.total:e.value; })
    .filter(function(v){ return v!=null && !isNaN(v); });
  if(!vals.length) return null;
  var lower = id==='fly';
  return lower ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
}

function getPRWithDate(ath, id){
  var best=null, bestDate=null;
  state.entries.filter(function(e){ return e.athlete===ath && e.exercise===id; }).forEach(function(e){
    var v = id==='broad'?e.total:e.value; if(v==null||isNaN(v)) return;
    if(best==null||(id==='fly'?v<best:v>best)){ best=v; bestDate=e.date; }
  });
  return { pr:best, date:bestDate };
}

function checkPRLive(){
  var ind = document.getElementById('pr-indicator'); if(!ind||!logAthlete) return;
  var current = getPR(logAthlete, logEx);
  var newVal;
  if(logEx==='broad'){
    var ft=parseFloat((document.getElementById('res-ft')||{}).value);
    var inch=parseFloat((document.getElementById('res-in')||{}).value);
    if(isNaN(ft)||isNaN(inch)){ind.textContent='';return;}
    newVal = ft*12+inch;
  } else {
    newVal = parseFloat((document.getElementById('res-val')||{}).value);
    if(isNaN(newVal)){ind.textContent='';return;}
  }
  if(current==null){
    ind.innerHTML='<span style="color:var(--green)">✓ First entry for this exercise</span>';
  } else {
    var isPR = logEx==='fly' ? newVal<current : newVal>current;
    if(isPR){
      var diff = logEx==='fly' ? (current-newVal).toFixed(2)+'s' : logEx==='broad' ? (newVal-current).toFixed(1)+' in' : logEx==='pacer' ? Math.round(newVal-current)+' laps' : (newVal-current).toFixed(3)+'"';
      ind.innerHTML='<span style="color:var(--green)">🏆 NEW PR! +'+diff+' improvement</span>';
    } else {
      ind.innerHTML='<span style="color:var(--muted)">Current PR: '+fmtPR(logEx,current)+'</span>';
    }
  }
}

    var inch=parseFloat((document.getElementById('res-in')||{}).value);
    if(isNaN(ft)||isNaN(inch)){ alert('Enter feet and inches.'); return; }

// ── ROSTER TAB ────────────────────────────────────────────────────────────
// ── Roster management (Aug 2026): rename + delete, mirroring the gym portal ──
// Both flow through the normal save pipeline so the server-side union-merge keeps
// them durable: renames rewrite entries in place (same ids -> incoming wins on the
// merge), deletions send tombstones so stale tabs can't resurrect the athlete.
function renameTeamAthlete(oldName){
  var newName = prompt('Rename "'+oldName+'" to:', oldName);
  if(newName==null) return;
  newName = newName.trim();
  if(!newName || newName===oldName) return;
  var roster = state.athletes[currentTeam]||[];
  if(roster.indexOf(newName)>-1){ alert('"'+newName+'" is already on this roster.'); return; }
  var idx = roster.indexOf(oldName);
  if(idx===-1){ alert('Athlete not found on this team.'); return; }
  roster[idx] = newName;
  state.entries.forEach(function(e){ if(e.athlete===oldName) e.athlete = newName; });
  if(state.profiles[oldName]){ state.profiles[newName] = state.profiles[oldName]; delete state.profiles[oldName]; }
  (state.achievements||[]).forEach(function(a){ if(a && a.athlete===oldName) a.athlete = newName; });
  if(studioAthlete===oldName) studioAthlete = newName;
  saveData(); showToast('Renamed to '+newName+'.'); render();
}
function deleteTeamAthlete(name){
  var n = state.entries.filter(function(e){ return e.athlete===name; }).length;
  var na = _attFor(currentTeam).filter(function(a){ return a.athlete===name; }).length;
  if(!confirm('Delete '+name+'? This removes their '+n+' entr'+(n===1?'y':'ies')+' and '+na+' attendance record'+(na===1?'':'s')+' and cannot be undone.')) return;
  var typed=prompt('To confirm, type delete');
  if(typed==null || typed.trim().toLowerCase()!=='delete'){ showToast('Deletion cancelled \u2014 nothing was changed.'); return; }
  var roster = state.athletes[currentTeam]||[];
  var idx = roster.indexOf(name);
  if(idx>-1) roster.splice(idx,1);
  state.entries = state.entries.filter(function(e){
    if(e.athlete!==name) return true;
    if(e.id!=null && _pendingTeamDeletes.indexOf(e.id)===-1) _pendingTeamDeletes.push(e.id);
    return false;
  });
  state.attendance=(state.attendance||[]).filter(function(a){
    if(!(a.team===currentTeam && a.athlete===name)) return true;
    if(a.id!=null && _pendingAttDeletes.indexOf(a.id)===-1) _pendingAttDeletes.push(a.id);
    return false;
  });
  delete state.profiles[name];
  state.achievements = (state.achievements||[]).filter(function(a){ return !a || a.athlete!==name; });
  if(studioAthlete===name) studioAthlete = '';
  saveData(); showToast(name+' deleted.'); render();
}

  var teamSel = renderTeamSelector();
  if(!currentTeam) return teamSel+'<div class="panel"><div class="empty">Select a team above.</div></div>';

  var athletes = getTeamAthletes();
  var q = (rosterQ||'').toLowerCase();

  if(!athletes.length) return teamSel+search+'<div class="panel"><div class="empty">No athletes on this team yet.</div></div>';

  var cards = athletes.map(function(name){
    var p = state.profiles[name]||{};
    var pills = EX_LIST.map(function(e){
      var pr = getPR(name, e.id); if(pr==null) return '';
      var cls = e.id==='fly'?'pill-fly':e.id==='broad'?'pill-broad':'pill-vert';
      var lbl = e.id==='fly'?'10-10':e.id==='broad'?'Broad':'Sky';
      return '<span class="pr-pill '+cls+'">'+lbl+': '+fmtPR(e.id,pr)+'</span>';
    }).join('');
    var entryCount = state.entries.filter(function(e){ return e.athlete===name; }).length;
    return '<div class="roster-card">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
      '<div><div class="roster-name">'+name+'</div>'+
      '<div class="roster-sub">'+(p.sports||'')+(p.sports&&entryCount?' · ':'')+entryCount+' entries</div>'+
      (pills?'<div style="margin-top:8px">'+pills+'</div>':'')+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
      '<button class="btn btn-ghost btn-sm" onclick="openReport(\''+_esc(name)+'\')">Report</button>'+
      '<button class="copy-btn" onclick="copyToGym(\''+_esc(name)+'\')">Copy to Gym</button>'+
      '<div style="display:flex;gap:6px">'+
        '<button class="btn btn-ghost btn-sm" onclick="renameTeamAthlete(\''+_esc(name)+'\')">\u270E Rename</button>'+

      '</div>'+
      '</div></div></div>';
  }).join('');

  return teamSel+search+cards;
}

function openReport(name){
  var win = window.open('','_blank');
  var entries = state.entries.filter(function(e){ return e.athlete===name; });
  if(!entries.length){ win.document.write('<p>No entries for '+name+'</p>'); return; }

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>'+name+' — FPT Report</title>';
  html += '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>';
  html += '<style>body{background:#07090B;color:#F0F2F5;font-family:Barlow,sans-serif;padding:32px;max-width:700px;margin:0 auto}';
  html += 'h1{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;color:#fff;margin-bottom:4px}';
  html += '.sub{color:#7A8694;font-size:14px;margin-bottom:32px}';
  html += '.ex-section{margin-bottom:32px}';
  html += '.ex-title{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #252B33}';
  html += '.pr-val{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:900}';
  html += '.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}';
  html += '.stat-box{background:#0F1215;border:1px solid #252B33;border-radius:8px;padding:12px 16px}';
  html += '.stat-lbl{font-size:11px;color:#7A8694;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}';
  html += '.stat-num{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:900}';
  html += 'table{width:100%;border-collapse:collapse;font-size:13px}';
  html += 'th{text-align:left;color:#7A8694;font-weight:500;padding:6px 8px;border-bottom:1px solid #252B33}';
  html += 'td{padding:6px 8px;border-bottom:1px solid #0F1215}';
  html += '</style></head><body>';
  html += '<h1>'+name+'</h1>';
  html += '<div class="sub">FPT Team Training Report &nbsp;·&nbsp; Generated '+new Date().toLocaleDateString()+'</div>';

  EX_LIST.forEach(function(ex){
    var exEntries = entries.filter(function(e){ return e.exercise===ex.id; });
    if(!exEntries.length) return;
    var vals = exEntries.map(function(e){ return ex.id==='broad'?e.total:e.value; }).filter(function(v){ return v!=null&&!isNaN(v); });
    var lower = ex.id==='fly';
    var best = lower?Math.min.apply(null,vals):Math.max.apply(null,vals);
    var avg = vals.reduce(function(a,b){return a+b;},0)/vals.length;
    var sorted = exEntries.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var colors = {fly:'#FF5C35',broad:'#3B9EFF',vert:'#2ECC71'};

    html += '<div class="ex-section">';
    html += '<div class="ex-title" style="color:'+colors[ex.id]+'">'+ex.name+'</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="stat-lbl">Best</div><div class="stat-num" style="color:'+colors[ex.id]+'">'+fmtPR(ex.id,best)+'</div></div>';
    html += '<div class="stat-box"><div class="stat-lbl">Average</div><div class="stat-num">'+fmtPR(ex.id,avg)+'</div></div>';
    html += '<div class="stat-box"><div class="stat-lbl">Attempts</div><div class="stat-num">'+vals.length+'</div></div>';
    html += '</div>';
    html += '<table><thead><tr><th>Date</th><th>Result</th></tr></thead><tbody>';
    sorted.forEach(function(e){
      var v = ex.id==='broad'?e.total:e.value;
      var isPR = v===best;
      html += '<tr><td>'+fmtDate(e.date)+'</td><td style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:800'+(isPR?';color:'+colors[ex.id]:'')+'">'+fmtPR(ex.id,v)+(isPR?' ★':'')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  });

  html += '</body></html>';
  win.document.write(html);
  win.document.close();
}

function copyToGym(name){
  if(!confirm('Copy '+name+' to the gym portal? This is a one-time snapshot — their current entries and profile will be added to the gym roster.')){return;}
  fetch(API_URL, {
    method:'POST',
    body: JSON.stringify({ action:'copyAthleteToGym', athleteName:name })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.ok){
      showToast(name+' copied to gym ('+d.entriesCopied+' entries)');
    } else {
      alert('Copy failed: '+(d.error||'unknown error'));
    }
  })
  .catch(function(){ alert('Network error. Try again.'); });
}

    active.forEach(function(a){
      var exp=new Date(a.dateAdded+'T12:00:00'); exp.setDate(exp.getDate()+a.durationWeeks*7);
      var daysLeft=Math.ceil((exp-now)/(1000*60*60*24));
      var isEditing = achEditId===a.id;

        editForm='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px">'+

          '<button class="btn btn-ghost btn-sm" onclick="achEditId=null;render()">Cancel</button>'+
          '</div></div>';
      }
      html+='<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px">'+

        '<div style="font-size:13px;color:var(--text);margin-top:2px">'+a.achievement+'</div>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:4px">Expires in '+daysLeft+' day'+(daysLeft!==1?'s':'')+'</div></div>'+
        '<div style="display:flex;gap:6px">'+

function addAch(){
  if(!achAthlete||!achText.trim()){ alert('Select an athlete and enter achievement.'); return; }
  state.achievements = (state.achievements||[]).concat([{
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    athlete:achAthlete, achievement:achText,
    dateAdded:new Date().toISOString().slice(0,10),
    durationWeeks:achWeeks, archived:false
  }]);
  saveData(); showToast('Achievement added!'); achText=''; achAthlete=''; render();
}

function saveAchEdit(){
  var a=(state.achievements||[]).filter(function(x){return x.id===achEditId;})[0]; if(!a) return;
  a.achievement=achEditText; a.durationWeeks=achEditWeeks; achEditId=null;
  saveData(); showToast('Achievement updated!'); render();
}

function endNowAch(id){
  var a=(state.achievements||[]).filter(function(x){return x.id===id;})[0]; if(!a) return;
  a.archived=true; saveData(); showToast('Achievement ended.'); render();
}

var newTeamName = '';
var newTeamSeason='', newTeamYear='', newTeamOrg='', newTeamGrade='', newTeamSport='';
function renderSettingsTeams(){
  var seasons=['Winter','Spring','Summer','Fall'];
  var yrs=[]; var thisYr=new Date().getFullYear();
  for(var y=thisYr-1;y<=thisYr+1;y++) yrs.push(String(y));
  var html = '<div class="panel"><div class="panel-title">Manage Teams</div>';
  html += '<div class="form-group"><div class="form-label">New Team \u00b7 Organization / Grade (optional) / Sport-Team / Season / Year</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
    '<input class="form-input" list="org-list" style="flex:2;min-width:140px" placeholder="Organization (e.g. West Allegheny)" value="'+newTeamOrg.replace(/"/g,'&quot;')+'" oninput="newTeamOrg=this.value"/>'+
    '<datalist id="org-list">'+_allOrgs().map(function(o){return '<option value="'+_esc(o)+'"></option>';}).join('')+'</datalist>'+
    '<input class="form-input" list="grade-list" style="flex:1;min-width:110px" placeholder="Grade (optional)" value="'+newTeamGrade.replace(/"/g,'&quot;')+'" oninput="newTeamGrade=this.value" title="Only needed for organizations with a level between org and team, like a school\'s grades. Sports teams can leave this blank."/>'+
    '<datalist id="grade-list">'+_allGrades(newTeamOrg).map(function(g){return '<option value="'+_esc(g)+'"></option>';}).join('')+'</datalist>'+
    '<input class="form-input" style="flex:1;min-width:110px" placeholder="Sport / Team (e.g. Track & Field, Team 1)" value="'+newTeamSport.replace(/"/g,'&quot;')+'" oninput="newTeamSport=this.value"/>'+
    '<select class="form-input" style="flex:1;min-width:90px" onchange="newTeamSeason=this.value">'+'<option value="">Season</option>'+seasons.map(function(s){return '<option'+(s===newTeamSeason?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
    '<select class="form-input" style="flex:1;min-width:80px" onchange="newTeamYear=this.value">'+'<option value="">Year</option>'+yrs.map(function(y){return '<option'+(y===newTeamYear?' selected':'')+'>'+y+'</option>';}).join('')+'</select>'+
    '</div></div>'+
    '<button class="btn btn-team" id="team-save-btn" style="width:100%;margin-top:4px">Add Team</button>';

  function card(t, archived){
    var m=_meta(t), count=(state.athletes[t]||[]).length;
    var stale='';
    if(!archived){
      var dates=[];
      (state.entries||[]).forEach(function(e){ if((state.athletes[t]||[]).indexOf(e.athlete)>-1&&e.date) dates.push(e.date); });
      (state.attendance||[]).forEach(function(a){ if(a.team===t&&a.date) dates.push(a.date); });
      dates.sort();
      if(dates.length){
        var ageDays=(Date.now()-new Date(dates[dates.length-1]+'T12:00:00').getTime())/86400000;
        if(ageDays>42) stale='<span style="font-size:10px;color:var(--amber,#d97706);margin-left:6px">season over?</span>';
      }
    }
    var actions = archived
      ? '<button class="action-btn" onclick="restoreTeam(\''+_esc(t)+'\')">Restore</button>'+
        '<button class="action-btn" onclick="selectTeam(\''+_esc(t)+'\')">Open</button>'
      : '<button class="action-btn" onclick="startNewSeason(\''+_esc(t)+'\')">New Season</button>'+
        '<button class="action-btn" onclick="archiveTeam(\''+_esc(t)+'\')">Archive</button>'+
        '<button class="action-btn" style="color:var(--red)" onclick="deleteTeam(\''+_esc(t)+'\')">Delete</button>';
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">'+
      '<div style="min-width:0"><div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_esc(_orgGradeSport(m))+' <span style="font-weight:600;font-size:12px;color:var(--muted)">'+(m.season?m.season+' ':'')+(m.year||'')+'</span>'+stale+'</div>'+
      '<div style="font-size:12px;color:var(--muted)">'+count+' athlete'+(count!==1?'s':'')+'</div></div>'+
      '<div style="display:flex;gap:4px;flex-shrink:0">'+actions+'</div></div>';
  }
  var act=_activeTeams(), arc=_archivedTeams();
  html += '<div class="section-divider"></div><div class="form-label" style="margin-bottom:6px">Active</div>';
  html += act.length ? '<div style="display:flex;flex-direction:column;gap:8px">'+act.map(function(t){return card(t,false);}).join('')+'</div>'
                     : '<div class="empty" style="padding:10px 0">No active teams.</div>';
  if(arc.length){
    html += '<div class="section-divider"></div><div class="form-label" style="margin-bottom:6px">Previous Seasons</div>';
    // Historical browser: Organization -> Grade (optional) -> Sport -> Year -> Season.
    // Generic ordered-filter-chain so grade slots in cleanly as just another level --
    // orgs with no grade-having teams simply never populate that dropdown's options.
    var HIST_LEVELS=['org','grade','sport','year','season'];
    var histSel={
      org:window._histOrg||'', grade:window._histGrade||'', sport:window._histSport||'',
      year:window._histYear||'', season:window._histSeason||''
    };
    function opts(pick){
      var idx=HIST_LEVELS.indexOf(pick), o={};
      arc.forEach(function(t){
        var m=_meta(t);
        for(var i=0;i<idx;i++){ var lvl=HIST_LEVELS[i]; if(histSel[lvl]&&m[lvl]!==histSel[lvl]) return; }
        if(m[pick]) o[m[pick]]=1;
      });
      return Object.keys(o).sort();
    }
    // clears every level AFTER the one just changed, so stale lower selections don't linger
    function _histReset(fromIdx){
      var out='';
      for(var i=fromIdx+1;i<HIST_LEVELS.length;i++) out+='window._hist'+HIST_LEVELS[i].charAt(0).toUpperCase()+HIST_LEVELS[i].slice(1)+'=\'\';';
      return out;
    }
    var LEVEL_LABEL={org:'All organizations',grade:'Grade',sport:'Sport',year:'Year',season:'Season'};
    html += '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">'+
      HIST_LEVELS.map(function(lvl,i){
        var cap='window'+'._hist'+lvl.charAt(0).toUpperCase()+lvl.slice(1);
        var vals=opts(lvl);
        if(lvl==='grade' && !vals.length) return '';   // no grade-having teams anywhere yet -- skip the dropdown entirely

// Builds the team's unique key. Grade folds in right after org when set, so e.g.
// "Dutch Ridge 3rd Grade Team 1" and "Dutch Ridge 4th Grade Team 1" never collide
// even though both are just called "Team 1" by their teacher. When grade is blank
// the key is byte-identical to the original org+sport format (zero change for

function _teamKey(org, grade, sport, season, year){

function _lum(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 0.299*r + 0.587*g + 0.114*b;
}
function _hexA(hex, a){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

// intake-day best (direction-aware) and best-to-best improvement %
function getIntakeBest(ath, id){
  var ents = state.entries.filter(function(e){ return e.athlete===ath && e.exercise===id; });
  if(!ents.length) return null;
  var firstDate = ents.map(function(e){ return e.date; }).sort()[0];
  var vals = ents.filter(function(e){ return e.date===firstDate; })
                 .map(function(e){ return id==='broad'?e.total:e.value; })
                 .filter(function(v){ return v!=null && !isNaN(v); });
  if(!vals.length) return null;
  return id==='fly' ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
}
// ── Two-session comparison (Aug 2026, per Chris's feedback) ─────────────────
// Compares the intake SESSION to the retest SESSION (earliest vs latest test date
// per athlete+exercise), on two bases: session BEST and session AVERAGE of attempts.
// Unlike the old all-time-PR basis, these can go negative — a retest slower than
// intake reads as a regression instead of silently clamping to 0. Athletes with
// only one session return null and drop out of team math entirely.
var REPORT_EXCLUDE = ['Maya Haag']; // injured during retest window — out of team stats
function getSessionComparison(ath, id){
  var byDate = {};
  state.entries.forEach(function(e){
    if(e.athlete!==ath || e.exercise!==id || !e.date) return;
    var v = (id==='broad') ? e.total : e.value;
    if(v==null || isNaN(v)) return;
    (byDate[e.date]=byDate[e.date]||[]).push(v);
  });
  var dates = Object.keys(byDate).sort();
  if(dates.length < 2) return null;
  function stats(vals){
    var best = (id==='fly') ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
    var avg = vals.reduce(function(s,v){return s+v;},0)/vals.length;
    return {best:best, avg:avg};
  }
  var t1 = stats(byDate[dates[0]]), t2 = stats(byDate[dates[dates.length-1]]);
  function impPct(a,b){ if(!a) return 0; return (id==='fly' ? (a-b)/a : (b-a)/a)*100; }
  return {
    intakeBest:t1.best, retestBest:t2.best, bestImpPct:impPct(t1.best,t2.best),
    intakeAvg:t1.avg,  retestAvg:t2.avg,  avgImpPct:impPct(t1.avg,t2.avg),
    intakeDate:dates[0], retestDate:dates[dates.length-1]
  };
}
function getImprovementPct(ath, id){
  var intake = getIntakeBest(ath,id), best = getPR(ath,id);
  if(intake==null || best==null || intake===0) return null;
  return id==='fly' ? (intake-best)/intake*100 : (best-intake)/intake*100;
}
function _spotVal(id, v){
  if(v==null || isNaN(v)) return '--';
  if(id==='broad') return Math.floor(v/12)+"'"+Math.round(v%12);
  if(id==='fly')   return v.toFixed(2);
  if(id==='pacer') return String(Math.round(v));
  return String(parseFloat(v.toFixed(1)));
}

function _spotBoxes(ath, P, positiveOnly){
  var muted = _hexA(P.text, 0.55);
  var defs = [
    ['broad','Broad Jump'],
    ['fly','10-10 Fly'],
    ['vert','Skyhook'],
    ['pacer','Pacer Test']
  ];
  // Per exercise: BEST box + AVERAGE box, each with a colored delta chip vs intake
  // (green = improved, red = regressed) once a retest session exists. Direction-aware.
  function chip(id, pct){
    if(pct==null) return '<div style="color:'+muted+';font-size:9px;font-weight:700;margin-top:2px">\u2014</div>';
    var col = pct>0 ? '#22c55e' : (pct<0 ? '#ef4444' : muted);
    var arrow = pct>0 ? '\u25B2' : (pct<0 ? '\u25BC' : '\u2013');
    return '<div style="color:'+col+';font-size:10px;font-weight:900;margin-top:2px">'+arrow+' '+(pct>=0?'+':'')+pct.toFixed(1)+'% vs intake</div>';
  }
  var html = '';
  defs.forEach(function(d){
    var id=d[0];
    var c = getSessionComparison(ath, id);
    var bestVal = _spotVal(id, c ? c.retestBest : getPR(ath,id));
    var avgVal  = c ? _spotVal(id, c.retestAvg) : '--';
    [[d[1]+' Best', bestVal, c?c.bestImpPct:null],
     [d[1]+' Avg',  avgVal,  c?c.avgImpPct:null]].forEach(function(t){
      if(positiveOnly && !(t[2]>0)) return;   // positive-only mode: green boxes only
      html += '<div style="border:1.5px solid '+P.accent+';padding:7px 9px;background:'+_hexA('#000000',0.30)+'">'+
        '<div style="color:'+muted+';font-size:8px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px">'+t[0]+'</div>'+
        '<div style="color:'+P.text+';font-size:26px;font-weight:900;line-height:1;letter-spacing:-1px">'+t[1]+'</div>'+
        chip(id, t[2])+'</div>';
    });
  });
  return html;
}

// ── Bulk card download (Aug 2026, per Chris) ────────────────────────────────
// Renders every athlete's Spotlight card offscreen (logo hero forced — no photos
// needed), zips the PNGs, downloads one file. Two modes: all tests, or positive-only
// (green boxes only; athletes with nothing positive are skipped in that mode).
async function _bulkDownloadCards(positiveOnly){
  if(!window.html2canvas || !window.JSZip){ alert('Still loading libraries \u2014 try again in a moment.'); return; }
  var roster=(state.athletes[currentTeam]||[]).slice().sort(function(a,b){ return lastName(a).localeCompare(lastName(b)); });
  var list=roster.filter(function(a){
    if(REPORT_EXCLUDE.indexOf(a)>-1) return false;
    var any=state.entries.some(function(e){ return e.athlete===a; });
    if(!any) return false;
    if(!positiveOnly) return true;
    return ['broad','fly','vert','pacer'].some(function(id){
      var c=getSessionComparison(a,id);
      return c && (c.bestImpPct>0 || c.avgImpPct>0);
    });
  });
  if(!list.length){ alert('No matching athletes.'); return; }
  var btn=document.getElementById(positiveOnly?'bulk-pos-btn':'bulk-all-btn');
  var origLabel=btn?btn.textContent:'';
  var savedMode=studioMode; studioMode='logo';   // logo hero forced for bulk
  var holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:540px';
  document.body.appendChild(holder);
  var zip=new JSZip();
  try{
    for(var i=0;i<list.length;i++){
      var ath=list[i];
      if(btn) btn.textContent='Rendering '+(i+1)+'/'+list.length+'\u2026';
      holder.innerHTML=_spotlightCardHtml(ath, !!positiveOnly);
      // wait for logos/images inside the card (3s cap each)
      await Promise.all(Array.prototype.map.call(holder.querySelectorAll('img'),function(img){
        return (img.complete&&img.naturalWidth>0)?null:new Promise(function(r){ img.onload=r; img.onerror=r; setTimeout(r,3000); });
      }));
      _fitSpotNameIn(holder);
      var canvas=await window.html2canvas(holder.firstElementChild,{scale:2,useCORS:true,backgroundColor:null,logging:false});
      var blob=await new Promise(function(r){ canvas.toBlob(r,'image/png'); });
      zip.file('FPT_'+ath.replace(/\s+/g,'_')+'_Spotlight.png', blob);
    }
    if(btn) btn.textContent='Building zip\u2026';
    var zipBlob=await zip.generateAsync({type:'blob'});
    var url=URL.createObjectURL(zipBlob);
    var a=document.createElement('a');
    var _bn=_teamLabelBits();
    a.href=url; a.download='FPT_'+(_bn.name||'team').replace(/\s+/g,'_')+'_'+_bn.season+_bn.year+'_Cards'+(positiveOnly?'_Positive':'')+'.zip';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },10000);
    showToast(list.length+' cards zipped.');
  }catch(e){ console.error(e); alert('Bulk render failed partway \u2014 try again.'); }
  finally{
    studioMode=savedMode;
    if(holder.parentNode) document.body.removeChild(holder);
    if(btn) btn.textContent=origLabel;
  }
}

// ── Parent Reports (Aug 2026): printable one-pager per athlete ─────────────
// Built synchronously from state (no canvas), so window.open stays inside the tap
// gesture and works on iOS. Parents print / save-as-PDF from the browser.
function _teamPercentileBest(ath, id){
  var peers=[];
  (state.athletes[currentTeam]||[]).forEach(function(a){
    if(REPORT_EXCLUDE.indexOf(a)>-1) return;
    var c=getSessionComparison(a,id);
    if(c) peers.push({ath:a, imp:c.bestImpPct});
  });
  if(peers.length<2) return null;
  var mine=peers.filter(function(p){return p.ath===ath;})[0];
  if(!mine) return null;
  var below=peers.filter(function(p){return p.imp<mine.imp;}).length;
  return Math.round(below/(peers.length-1)*100);
}
// ════════ ATTENDANCE (Aug 2026, for the club baseball team & beyond) ════════
// One row per check-in: {id, team, athlete, date, session}. Weekly compliance:
// 2+ distinct dates in a Mon-Sun week = green, 1 = amber, 0 = red (binary — no
// excuse tracking by design). Sessions are per-team labels, editable, scalable
// to any schedule even though this team runs one 7-8 PM slot per day.
function _attUid(){ return 'att-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function _teamSessions(){ return (state.sessions&&state.sessions[currentTeam])||[]; }
function _attFor(team){ return (state.attendance||[]).filter(function(a){ return a.team===team; }); }
function _mondayOf(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  var day=(d.getDay()+6)%7;                       // Mon=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function _attWeeks(){
  var recs=_attFor(currentTeam);
  if(!recs.length) return [];
  var dates=recs.map(function(a){return a.date;}).sort();
  var start=_mondayOf(dates[0]);
  var end=_mondayOf(dates[dates.length-1]);
  var today=_mondayOf(new Date().toISOString().slice(0,10));
  if(today>end) end=today;                        // show current (possibly red) week
  var weeks=[], d=new Date(start+'T12:00:00');
  while(d.toISOString().slice(0,10)<=end && weeks.length<60){
    weeks.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+7);
  }
  return weeks;
}
function _athWeekDates(ath, weekMon){
  var wk={}; _attFor(currentTeam).forEach(function(a){
    if(a.athlete===ath && _mondayOf(a.date)===weekMon) wk[a.date]=1;
  });
  return Object.keys(wk).length;
}
function _teamRequired(){ var r=(state.required&&state.required[currentTeam]); return (r>=1&&r<=7)?r:2; }
// Requirement-anchored scale (Aug 2026): green = met the team's weekly requirement,
// amber = attended but short, red = absent. Consistent at any requirement value.
function _attColor(n){ var req=_teamRequired(); return n>=req?'#15803d':(n>0?'#d97706':'#b91c1c'); }
function editRequired(){
  var v=prompt('Required sessions per week for '+_teamDisplay(currentTeam)+':', String(_teamRequired()));
  if(v==null) return;

function _athSeasonStats(ath){
  var req=_teamRequired();
  var weeks=_attWeeks(), green=0, streak=0, total={};
  weeks.forEach(function(w){ if(_athWeekDates(ath,w)>=req) green++; });
  for(var i=weeks.length-1;i>=0;i--){ if(_athWeekDates(ath,weeks[i])>=req) streak++; else break; }
  _attFor(currentTeam).forEach(function(a){ if(a.athlete===ath) total[a.date+a.session]=1; });
  return { weeks:weeks.length, green:green, streak:streak, sessions:Object.keys(total).length };
}
function toggleAttendance(ath){

  });
  if(existing.length){
    state.attendance=state.attendance.filter(function(a){
      if(existing.indexOf(a)===-1) return true;
      if(a.id!=null && _pendingAttDeletes.indexOf(a.id)===-1) _pendingAttDeletes.push(a.id);
      return false;

}

function _drawAttendanceSection(doc, ath, y, M, W){

async function _bulkParentPdfs(){

function _reportDates(){
  var seen={}; state.entries.forEach(function(e){ if(e.athlete && (state.athletes[currentTeam]||[]).indexOf(e.athlete)>-1 && e.date) seen[e.date]=1; });
  var arr=Object.keys(seen).sort();
  return { intake:arr[0]||null, retest:arr[arr.length-1]||null, count:arr.length };
}
function _fmtDelta(id, d){
  var mag = (id==='broad') ? Math.round(Math.abs(d))+'\u2033'
    : (id==='fly') ? Math.abs(d).toFixed(2)+'s'
    : (id==='pacer') ? Math.round(Math.abs(d))+' laps'
    : Math.abs(d).toFixed(1)+'\u2033';
  return (d>=0?'+':'\u2212')+mag;
}
function _teamReportData(){
  var roster=state.athletes[currentTeam]||[];
  var out={ retested:{} };
  ['broad','fly','vert','pacer'].forEach(function(id){
    var rows=[];
    roster.forEach(function(ath){
      if(REPORT_EXCLUDE.indexOf(ath)>-1) return;              // injured etc.
      var c=getSessionComparison(ath,id);
      if(c==null) return;                                     // didn't test twice
      rows.push({ath:ath, c:c});
      out.retested[ath]=1;
    });
    var n=rows.length;
    function mean(f){ return n? rows.reduce(function(s,r){return s+f(r.c);},0)/n : 0; }
    out[id]={
      n: n,
      teamAvgT1:   mean(function(c){return c.intakeAvg;}),
      teamAvgT2:   mean(function(c){return c.retestAvg;}),
      avgImp:      mean(function(c){return c.avgImpPct;}),    // headline: avg-of-attempts basis
      improvedBest:rows.filter(function(r){return r.c.bestImpPct>0;}).length,
      improvedAvg: rows.filter(function(r){return r.c.avgImpPct>0;}).length,
      top5: rows.slice().sort(function(a,b){return b.c.bestImpPct-a.c.bestImpPct;}).slice(0,5)
             .map(function(r){return {ath:r.ath, imp:r.c.bestImpPct};})
    };
  });
  out.nRetested=Object.keys(out.retested).length;
  return out;
}

function _paletteFromImage(img){
  var c = document.createElement('canvas'); c.width = 80; c.height = 80;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 80, 80);
  var data = ctx.getImageData(0, 0, 80, 80).data; // throws if CORS-tainted
  var buckets = {};
  for(var i=0;i<data.length;i+=4){
    if(data[i+3] < 128) continue;
    var r = data[i] & 0xE0, g = data[i+1] & 0xE0, b = data[i+2] & 0xE0;
    var key = r+'_'+g+'_'+b;
    if(!buckets[key]) buckets[key] = { r:r, g:g, b:b, n:0 };
    buckets[key].n++;
  }
  var arr = Object.keys(buckets).map(function(k){ return buckets[k]; });
  if(!arr.length) throw new Error('empty');
  function lum(x){ return 0.299*x.r + 0.587*x.g + 0.114*x.b; }
  function sat(x){ var mx=Math.max(x.r,x.g,x.b), mn=Math.min(x.r,x.g,x.b); return mx===0?0:(mx-mn)/mx; }
  function hx(x){ return '#'+[x.r,x.g,x.b].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join(''); }
  var accent = arr.slice().sort(function(a,b){ return (sat(b)*Math.min(b.n,300)) - (sat(a)*Math.min(a.n,300)); })[0];
  var background = arr.slice().sort(function(a,b){ return lum(a) - lum(b); })[0];
  var text = arr.slice().sort(function(a,b){ return lum(b) - lum(a); })[0];
  return { accent: hx(accent), text: hx(text), background: hx(background) };
}

function _pullPalette(){
  var url = (brandingDraft.logoUrl||'').trim();
  if(!url){ alert('Enter a logo URL first.'); return; }
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    try {
      brandingDraft.palette = _paletteFromImage(img);
      brandingPullError = false; render();
      showToast('Palette pulled — confirm, swap, or nudge below.');
    } catch(err){ brandingPullError = true; render(); }
  };
  img.onerror = function(){ brandingPullError = true; render(); };
  img.src = url;
}

function _onBrandingFile(input){
  var f = input.files && input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      try {
        brandingDraft.palette = _paletteFromImage(img);
        brandingPullError = false; render();
        showToast('Palette pulled from image.');
      } catch(e){ alert('Could not read colors from that image.'); }
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(f);
}

function _onBrandingLogoFile(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(ev){
    brandingDraft.logoUrl=ev.target.result; // store as data URL: always displays + downloads, no CORS
    var img=new Image();
    img.onload=function(){ try{ brandingDraft.palette=_paletteFromImage(img); }catch(e){} brandingPullError=false; render(); showToast('Logo loaded \u2014 palette pulled.'); };
    img.onerror=function(){ render(); showToast('Logo loaded.'); };
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
}

function _updatePalettePreview(){

  ['accent','text','background'].forEach(function(k){

  });
  var pv = document.getElementById('palette-preview');
  if(pv) pv.style.background = p.background;
  var nm = document.getElementById('pp-name'); if(nm) nm.style.color = p.accent;
  var tx = document.getElementById('pp-text'); if(tx) tx.style.color = p.text;
}

function _assignRole(role, color){
  if(!brandingDraft.palette) return;
  var p = brandingDraft.palette;
  if((p[role]||'').toLowerCase() === color.toLowerCase()) return;
  var other = ['accent','text','background'].filter(function(r){ return r!==role && (p[r]||'').toLowerCase()===color.toLowerCase(); })[0];
  var old = p[role];
  p[role] = color;
  if(other) p[other] = old; // swap so all three colors stay assigned
  render();
}

    '<div class="form-group"><div class="form-label">Sport(s)</div><input class="form-input" placeholder="e.g. Volleyball" value="'+newAthSports.replace(/"/g,'&quot;')+'" oninput="newAthSports=this.value"/></div>'+
    '<button class="btn btn-team" id="team-athlete-add-btn" style="width:100%;margin-top:4px">Add Athlete</button></div>';

  // Existing athletes by team
  state.teams.forEach(function(t){
    var athletes = (state.athletes[t]||[]).slice().sort(function(a,b){ return lastName(a).localeCompare(lastName(b)); });
    if(!athletes.length) return;
    html += '<div class="panel"><div class="panel-title" style="font-size:13px;color:var(--team)">'+t+'</div>';
    athletes.forEach(function(name){
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'+
        '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:15px">'+name+'</div>'+
        '<button class="action-btn" style="color:var(--red)" onclick="removeAthleteFromTeam(\''+_esc(t)+'\',\''+_esc(name)+'\')">Remove</button>'+
        '</div>';
    });
    html += '</div>';
  });

  return html;
}

// ── Bulk Roster Import (Aug 2026) ────────────────────────────────────────────
// Built for the classroom use case (a teacher with dozens of "teams" -- e.g.
// Dutch Ridge's 5 grades x 5 groups each) where one-at-a-time Add Athlete is
// impractical. This CREATES teams that don't exist yet AND populates rosters
// in one pass, unlike the gym-side CSV importer (which only edits fields on
// already-existing athletes) -- a genuinely different job, so it's a separate
// tool rather than a reuse of that one.
var rosterImportReport = null;   // {createdTeams:[], addedByTeam:{team:[names]}, skipped:[], errors:[]}
var rosterImportOrg = '', rosterImportSeason = '', rosterImportYear = '';

// Same quoted-field-safe parser as the gym-side importer (handles commas/newlines
// inside quoted cells, e.g. a wrapped "Grade\n(3rd, 4th...)" style header).
function _parseRosterCsv(text){
  var rows=[], row=[], field='', inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(field); field=''; rows.push(row); row=[];
      } else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r[0]&&r[0].trim()); });
}
function _normalizeRosterHeader(h){ return String(h||'').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
var ROSTER_COL_PATTERNS=[
  [/^grade/,'grade'], [/^team/,'team'],
  [/^first/,'first'], [/^last/,'last'],
  [/^(student\s*)?name$/,'fullname'],   // supports a single "Name" column as an alternative to First+Last
  [/^gender/,'gender']
];
function _mapRosterHeader(h){
  var norm=_normalizeRosterHeader(h);
  for(var i=0;i<ROSTER_COL_PATTERNS.length;i++){ if(ROSTER_COL_PATTERNS[i][0].test(norm)) return ROSTER_COL_PATTERNS[i][1]; }
  return null;
}
function _rosterImportFile(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){ runRosterImport(e.target.result); };
  reader.readAsText(input.files[0]);
}
function dismissRosterImport(){ rosterImportReport=null; render(); }
function runRosterImport(csvText){
  if(!rosterImportOrg.trim()){ alert('Enter an Organization for this import first.'); return; }
  if(!rosterImportSeason||!rosterImportYear){ alert('Pick a Season and Year for this import first.'); return; }
  var rows=_parseRosterCsv(csvText);
  if(rows.length<2){ alert('No data rows found in that file.'); return; }
  var fieldFor=rows[0].map(_mapRosterHeader);
  var gradeCol=fieldFor.indexOf('grade'), teamCol=fieldFor.indexOf('team');
  var firstCol=fieldFor.indexOf('first'), lastCol=fieldFor.indexOf('last'), fullCol=fieldFor.indexOf('fullname');
  var genderCol=fieldFor.indexOf('gender');
  if(teamCol===-1){ alert('Could not find a "Team" column in the header row.'); return; }
  if(fullCol===-1 && (firstCol===-1||lastCol===-1)){ alert('Could not find a "Student Name" column (or First + Last columns).'); return; }

  var org=rosterImportOrg.trim(), season=rosterImportSeason, year=rosterImportYear;
  var createdTeams=[], addedByTeam={}, skipped=[], errors=[];
  var seenThisRun={};   // team|studentName -> true, catches duplicate rows within the same file

  for(var r=1;r<rows.length;r++){
    var row=rows[r]; if(!row.some(function(c){return c&&c.trim();})) continue;
    var grade = gradeCol>-1 ? (row[gradeCol]||'').trim() : '';
    var team = (row[teamCol]||'').trim();
    var name = fullCol>-1 ? (row[fullCol]||'').trim()
                          : ((row[firstCol]||'').trim()+' '+(row[lastCol]||'').trim()).trim();
    if(!team || !name){ errors.push('Row '+(r+1)+': missing team or student name'); continue; }
    var gender = genderCol>-1 ? (row[genderCol]||'').trim().toLowerCase() : '';
    if(gender && gender!=='male' && gender!=='female') gender='';

    var key=_teamKey(org, grade, team, season, year);
    var dupKey=key+'|'+name.toLowerCase();
    if(seenThisRun[dupKey]) continue;   // same student listed twice for the same team in this file
    seenThisRun[dupKey]=true;

    if(state.teams.indexOf(key)===-1){
      state.teams.push(key);
      state.teamMeta[key]={org:org, grade:grade, sport:team, season:season, year:year, archived:false};
      state.athletes[key]=[];
      state.required[key]=2;
      createdTeams.push(key);
    }
    if(state.athletes[key].indexOf(name)>-1){
      skipped.push(name+' (already on '+_teamDisplay(key)+')');
      continue;
    }
    state.athletes[key].push(name);
    if(!state.profiles[name]) state.profiles[name]={};
    if(gender && !state.profiles[name].gender) state.profiles[name].gender=gender;
    (addedByTeam[key]=addedByTeam[key]||[]).push(name);
  }

  rosterImportReport={createdTeams:createdTeams, addedByTeam:addedByTeam, skipped:skipped, errors:errors, org:org, season:season, year:year};
  saveData();
  render();
}

function addAthleteToTeam(){
  var name = newAthName.trim();
  if(!name||!newAthTeam){ alert('Enter athlete name and select a team.'); return; }
  if(!state.athletes[newAthTeam]) state.athletes[newAthTeam]=[];
  if(state.athletes[newAthTeam].indexOf(name)>-1){ alert('Athlete already on this team.'); return; }
  state.athletes[newAthTeam].push(name);
  if(!state.profiles[name]) state.profiles[name]={};
  state.profiles[name].gender = newAthGender;
  if(newAthSports) state.profiles[name].sports = newAthSports;
  newAthName=''; newAthSports='';
  saveData(); showToast(name+' added to '+newAthTeam+'!'); render();
}

function removeAthleteFromTeam(team, name){
  if(!confirm('Remove '+name+' from '+team+'? Their entries will not be deleted.')){ return; }
  state.athletes[team] = (state.athletes[team]||[]).filter(function(a){ return a!==name; });
  saveData(); showToast('Removed from team.'); render();
}

// Settings — Copy to Gym
function renderSettingsCopyToGym(){
  var html = '<div class="panel"><div class="panel-title">Copy Athlete to Gym</div>';
  html += '<p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px">Promote a team athlete to the gym portal. This is a one-time snapshot — their profile and all entries are copied to the gym roster. The team record stays intact.</p>';

  var allAthletes = [];
  state.teams.forEach(function(t){
    (state.athletes[t]||[]).forEach(function(name){
      if(allAthletes.indexOf(name)===-1) allAthletes.push(name);
    });
  });
  allAthletes.sort(function(a,b){ return lastName(a).localeCompare(lastName(b)); });

  if(!allAthletes.length){
    html += '<div class="empty">No athletes yet.</div>';
  } else {
    allAthletes.forEach(function(name){
      var entryCount = state.entries.filter(function(e){ return e.athlete===name; }).length;
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">'+
        '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:15px">'+name+'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+entryCount+' entries</div></div>'+
        '<button class="copy-btn" onclick="copyToGym(\''+_esc(name)+'\')">Copy to Gym</button>'+
        '</div>';
    });
  }
  html += '</div>';
  return html;
}

// Settings — Backup
function renderSettingsBackup(){
  return '<div class="panel"><div class="panel-title">Backup & Restore</div>'+
    '<div style="display:flex;flex-direction:column;gap:20px">'+
    '<div><div class="form-label" style="margin-bottom:6px">Download Backup</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Exports all team data as a JSON file.</div>'+
    '<button class="btn btn-team" onclick="downloadBackup()">Download Backup</button></div>'+
    '<div style="border-top:1px solid var(--border);padding-top:16px">'+
    '<div class="form-label" style="margin-bottom:6px">Restore from Backup</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Upload a backup JSON. <strong style="color:var(--red)">This overwrites all current team data.</strong></div>'+
    '<label class="btn btn-ghost" style="cursor:pointer">Choose File<input type="file" accept=".json" style="display:none" onchange="restoreBackup(this)"/></label>'+
    '</div></div></div>';
}

function downloadBackup(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'FPT_Teams_Backup_'+TODAY+'.json';
  a.click();
}

function restoreBackup(input){
  var file = input.files[0]; if(!file) return;
  if(!confirm('Restore from this file? All current team data will be overwritten.')) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data.teams){ alert('Invalid backup file.'); return; }
      state = data;
      saveData(); showToast('Backup restored!'); render();
    } catch(err){ alert('Could not parse backup file.'); }
  };
  reader.readAsText(file);
}
</script>
